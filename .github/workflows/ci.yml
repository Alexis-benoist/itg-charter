name: CI

on:
  push:
    # Docs and evaluation summaries do not change the binary: no build, no release.
    paths-ignore: ["**.md", "eval/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "eval/**", "LICENSE"]

# A newer push to the same branch cancels the run in progress, except on main and tags,
# where every run publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        # Demucs and the ITGmania song library are not available here: the tests that
        # need them are #[ignore]d and the evaluation examples are run locally.
        run: cargo test

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Same seed twice gives byte-identical simfiles
        run: |
          cargo build --release
          for run in a b; do
            ./target/release/itg-charter gen tests/fixtures/test_song.mp3 --no-stems -s 42 -o "out-$run"
          done
          sha256sum out-a/*/*.sm out-b/*/*.sm
          cmp out-a/*/*.sm out-b/*/*.sm
      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: itg-charter-linux-x86_64
          path: |
            target/release/itg-charter
            README.md
            LICENSE
          if-no-files-found: error
      - name: Upload the song generated from the fixture (playable in ITGmania)
        uses: actions/upload-artifact@v4
        with:
          name: example-song-seed-42
          path: out-a/
          if-no-files-found: error

  # Home / default Demucs interpreter paths differ per OS (HOME vs USERPROFILE,
  # bin/python vs Scripts\python.exe): run their unit tests and check at runtime that,
  # without a Demucs venv, `gen` falls back to the full mix, names the expected default
  # interpreter and writes nothing in the current directory.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Path unit tests
        run: cargo test --lib "stems::"
      - name: No Demucs venv - full-mix fallback, default paths, clean cwd
        shell: bash
        run: |
          set -o pipefail
          cargo build --release
          snapshot() { git status --porcelain --ignored --untracked-files=all | grep -v ' target/' || true; }
          before=$(snapshot)
          bin=target/release/itg-charter
          unset ITG_CHARTER_PYTHON XDG_CACHE_HOME
          "$bin" gen tests/fixtures/test_song.mp3 --no-stems -s 42 -o "$RUNNER_TEMP/no-stems"
          ls "$RUNNER_TEMP"/no-stems/*/*.sm
          check() { # <expected python path> <env args...>
            expected="$1"; shift
            env "$@" "$bin" gen tests/fixtures/test_song.mp3 -s 42 -o "$RUNNER_TEMP/stems" 2>&1 | tee run.log
            ls "$RUNNER_TEMP"/stems/*/*.sm
            grep -F "full mix" run.log
            grep -F "Demucs python not found at $expected " run.log
            rm run.log
          }
          if [ "$RUNNER_OS" = Windows ]; then
            # Git Bash leaves these Windows variables in native form (C:\Users\...).
            check "$LOCALAPPDATA\\itg-charter\\demucs-venv\\Scripts\\python.exe"
            # No HOME (usual outside Git Bash) and no LOCALAPPDATA: USERPROFILE fallback.
            check "$USERPROFILE\\AppData\\Local\\itg-charter\\demucs-venv\\Scripts\\python.exe" -u HOME -u LOCALAPPDATA
          else
            check "$HOME/.local/share/itg-charter/demucs-venv/bin/python"
          fi
          # Nothing written relative to the current directory (stems cache included).
          after=$(snapshot)
          if [ "$before" != "$after" ]; then
            echo "::error::files written in the current directory"; diff <(echo "$before") <(echo "$after"); exit 1
          fi

  # Every push to main (and every v* tag) publishes a GitHub release with binaries for
  # all platforms, once the checks and the determinism test have passed (the binaries
  # are built in parallel with them; only `release` waits for everything). Pushes to
  # main get the version vMAJOR.MINOR.<run number> (MAJOR.MINOR from Cargo.toml).
  # On other branches and pull requests the binaries are built and smoke-tested but
  # nothing is published, so packaging problems show up before they reach main.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          majmin=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+)\.([0-9]+)\..*/\1.\2/')
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"; publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            tag="v${majmin}.${GITHUB_RUN_NUMBER}"; publish=true
          else
            tag="v${majmin}.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $tag (publish: $publish)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu runner: the binary then also runs on older glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64
            native: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: macos-arm64
            native: true
          # Intel macOS runners are retired (macos-13): cross-compile from Apple silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_suffix: macos-x86_64
            native: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: windows-x86_64
            native: true
    runs-on: ${{ matrix.os }}
    env:
      NAME: itg-charter-${{ needs.version.outputs.tag }}-${{ matrix.archive_suffix }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cargo build --release --locked --target ${{ matrix.target }} 2>&1 | tee build.log; then
            # Job logs need a login to read; annotations are public: surface the error.
            # Portable across GNU and BSD tools, and `|| true` so `bash -e` cannot stop here.
            msg=$( { grep -E -B2 -A12 "error(\[|:)" build.log || tail -40 build.log; } | tail -60 \
              | awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }' || true)
            echo "::error title=cargo build failed (${{ matrix.target }})::${msg:-build failed}"
            exit 1
          fi
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/itg-charter"
          "$bin" --version
          "$bin" gen tests/fixtures/test_song.mp3 --no-stems -s 42 -o smoke
          ls smoke/*/*.sm
      - name: Package
        shell: bash
        run: |
          mkdir "$NAME"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/itg-charter.exe" README.md LICENSE "$NAME/"
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            archive="$NAME.zip"
          else
            cp "target/${{ matrix.target }}/release/itg-charter" README.md LICENSE "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
            archive="$NAME.tar.gz"
          fi
          # sha256sum on Linux and in Git Bash on Windows, shasum on macOS.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.archive_suffix }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  # One job creates the release, with the binaries of every platform that built.
  release:
    needs: [check, determinism, version, build]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' && needs.determinism.result == 'success'
      && needs.version.result == 'success' && needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: itg-charter ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
