name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        # Demucs and the ITGmania song library are not available here: the tests that
        # need them are #[ignore]d and the evaluation examples are run locally.
        run: cargo test

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Same seed twice gives byte-identical simfiles
        run: |
          cargo build --release
          for run in a b; do
            ./target/release/itg-charter gen tests/fixtures/test_song.mp3 --no-stems -s 42 -o "out-$run"
          done
          sha256sum out-a/*/*.sm out-b/*/*.sm
          cmp out-a/*/*.sm out-b/*/*.sm
      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: itg-charter-linux-x86_64
          path: |
            target/release/itg-charter
            README.md
            LICENSE
          if-no-files-found: error
      - name: Upload the song generated from the fixture (playable in ITGmania)
        uses: actions/upload-artifact@v4
        with:
          name: example-song-seed-42
          path: out-a/
          if-no-files-found: error

  # Every push to main (and every v* tag) publishes a GitHub release with binaries for
  # all platforms, once the checks and the determinism test have passed. Pushes to
  # main get the version vMAJOR.MINOR.<run number> (MAJOR.MINOR from Cargo.toml).
  version:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [check, determinism]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            majmin=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+)\.([0-9]+)\..*/\1.\2/')
            tag="v${majmin}.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release $tag"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            archive_suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      NAME: itg-charter-${{ needs.version.outputs.tag }}-${{ matrix.archive_suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/itg-charter" README.md LICENSE "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:NAME
          Copy-Item "target\${{ matrix.target }}\release\itg-charter.exe", "README.md", "LICENSE" -Destination $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"
          (Get-FileHash "$env:NAME.zip" -Algorithm SHA256).Hash.ToLower() + "  $env:NAME.zip" | Out-File -Encoding ascii "$env:NAME.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.archive_suffix }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  # One job creates the release, with the binaries of every platform that built.
  release:
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: itg-charter ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
