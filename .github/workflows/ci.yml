name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        # Demucs and the ITGmania song library are not available here: the tests that
        # need them are #[ignore]d and the evaluation examples are run locally.
        run: cargo test

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Same seed twice gives byte-identical simfiles
        run: |
          cargo build --release
          for run in a b; do
            ./target/release/itg-charter gen tests/fixtures/test_song.mp3 --no-stems -s 42 -o "out-$run"
          done
          sha256sum out-a/*/*.sm out-b/*/*.sm
          cmp out-a/*/*.sm out-b/*/*.sm
      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: itg-charter-linux-x86_64
          path: |
            target/release/itg-charter
            README.md
            LICENSE
          if-no-files-found: error
      - name: Upload the song generated from the fixture (playable in ITGmania)
        uses: actions/upload-artifact@v4
        with:
          name: example-song-seed-42
          path: out-a/
          if-no-files-found: error

  # Pushing a tag like v0.2.0 publishes a GitHub release with the Linux binary,
  # once the checks and the determinism test have passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, determinism]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: |
          cargo build --release
          name="itg-charter-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/itg-charter README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            itg-charter-*.tar.gz
            itg-charter-*.tar.gz.sha256
          generate_release_notes: true
