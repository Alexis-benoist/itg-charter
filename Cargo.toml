[package]
name = "itg-charter"
version = "0.1.0"
edition = "2024"
description = "Generates ITGmania (In The Groove) step charts from an audio file"
license = "GPL-3.0-only"
repository = "https://github.com/Alexis-benoist/itg-charter"

[dependencies]
anyhow = "1.0.104"
aubio-rs = { version = "0.2.0", features = ["builtin"] }
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", features = ["mp3"] }

# aubio-sys ships no prebuilt bindings for Apple silicon ("No prebuilt bindings. Try use
# `bindgen` feature."): generate them there (needs libclang, provided by Xcode).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
aubio-rs = { version = "0.2.0", features = ["builtin", "bindgen"] }

[profile.test]
# Audio analysis is too slow unoptimized.
opt-level = 3
